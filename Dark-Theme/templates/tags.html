{% extends "base.html" %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-12">
        <nav aria-label="Tags navigation">
          <ul class="list-unstyled d-flex flex-wrap justify-content-center gap-3">
            {%- for tag, articles in tags|sort %}
              <li>
                <a href="{{ tag.slug }}"
                   class="badge bg-primary text-decoration-none fs-6 px-3 py-2"
                   title="View articles tagged with '{{ tag }}'"
                   rel="tag">
                  {{ tag }}
                  <span class="badge bg-light text-dark rounded-pill ms-2">{{ articles|count }}</span>
                </a>
              </li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </div>
  </div>
{% endblock %}
