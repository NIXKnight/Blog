{% extends "base.html" %}
{% block content %}
  <div class="container">
    <div class="row">
      <div class="col-md-12">
          <ul class="list">
          {%- for tag, articles in tags|sort %}
          <li><a href="{{ tag.slug }}">{{ tag }}</a> ({{ articles|count }})</li>
          {% endfor %}
          </ul>
      </div>
    </div>
  </div>
{% endblock %}
