{% extends "base.html" %}
{% block content %}
  <div class="container">
    <div class="row">
      <main class="col-12" itemscope itemtype="https://schema.org/WebPage">
        <article class="page-content" itemprop="mainContentOfPage">
          {% if page.title %}
            <h1 class="page-title mb-4" itemprop="headline">{{ page.title }}</h1>
          {% endif %}
          <div class="page-body" itemprop="text">
            {{ page.content }}
          </div>
        </article>
      </main>
    </div>
  </div>
{% endblock %}
